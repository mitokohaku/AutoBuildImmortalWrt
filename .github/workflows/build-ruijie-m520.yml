# 锐捷 RG-MTFi-M520 专用工作流
# 该机型为高通 IPQ8064(ipq806x/generic) 架构 arm_cortex-a15_neon-vfpv4
# 4GB eMMC 无 IMAGE_SIZE 限制 插件可以放心塞
name: Build Ruijie RG-MTFi-M520

on:
  workflow_dispatch:
    inputs:
      imagebuilder_tag:
        description: "ImmortalWrt 版本"
        required: true
        default: ipq806x-generic-openwrt-24.10.6
        type: choice
        options:
          - ipq806x-generic-openwrt-24.10.6
          - ipq806x-generic-openwrt-24.10.5
          - ipq806x-generic-openwrt-23.05.7
      custom_router_ip:
        description: "路由器管理地址 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      include_modem:
        description: "集成双卡 LTE 拨号套件(qmi/mbim/短信/信号/多拨)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

  # 改动构建链路时自动跑一次冒烟构建 只产出 artifact 不发 release
  push:
    branches:
      - feat/ipq806x-rg-mtfi-m520
    paths:
      - '.github/workflows/build-ruijie-m520.yml'
      - 'mediatek-filogic/build24.sh'
      - 'shell/**'
      - 'arch/ipq806x.conf'
      - 'model/ipq806x.txt'

permissions:
  contents: write

env:
  PROFILE: ruijie_rg-mtfi-m520
  PLATFORM: ipq806x/generic

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve build parameters
        run: |
          # push 触发时 inputs 为空 这里统一落到默认值
          echo "IB_TAG=${{ inputs.imagebuilder_tag || 'ipq806x-generic-openwrt-24.10.6' }}" >> $GITHUB_ENV
          echo "ROUTER_IP=${{ inputs.custom_router_ip || '192.168.100.1' }}" >> $GITHUB_ENV
          echo "INCLUDE_MODEM=${{ inputs.include_modem || 'no' }}" >> $GITHUB_ENV
          echo "INCLUDE_DOCKER=${{ inputs.include_docker || 'no' }}" >> $GITHUB_ENV
          echo "ENABLE_PPPOE=${{ inputs.enable_pppoe || 'no' }}" >> $GITHUB_ENV

      - name: Validate PPPoE inputs
        run: |
          if [[ "$ENABLE_PPPOE" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Save custom router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "$ROUTER_IP" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:$ROUTER_IP"

      - name: M520 hardware packages (always)
        run: |
          # 该机型 DTS 里声明了 ti,tca9539 I2C GPIO 扩展器(gsbi2 i2c 0x74)
          # 但 ImmortalWrt 的 DEVICE_PACKAGES 没带它的驱动 且 config-6.6 里
          # CONFIG_GPIO_PCA953X 也没有内建 → 扩展器不 probe
          # 后果: gpio-leds 引用 <&gpio_ext 15> 会一直 EPROBE_DEFER SYS 灯不亮
          #       扩展器另外 15 根脚(含疑似 LTE 模块供电/SIM 选择)完全摸不到
          # aiamadeus/lede 的 ipq806x 分支就是靠 kmod-gpio-pca953x 带起来的
          cat >> shell/custom-packages.sh <<'EOF'
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES kmod-gpio-pca953x"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES usbutils i2c-tools"
          EOF
          echo "✅ 已追加 tca9539 扩展器驱动与 usb/i2c 诊断工具"

      - name: Enable LTE modem packages
        if: env.INCLUDE_MODEM == 'yes'
        run: |
          # M520 是双卡 LTE 机型 这些包在 arm_cortex-a15_neon-vfpv4 源里都有
          cat >> shell/custom-packages.sh <<'EOF'
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES kmod-usb-net-qmi-wwan uqmi luci-proto-qmi"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES kmod-usb-net-cdc-mbim umbim luci-proto-mbim"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES kmod-usb-serial-option kmod-usb-acm usb-modeswitch luci-proto-3g"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES sms-tool luci-i18n-sms-tool-js-zh-cn"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-i18n-3ginfo-lite-zh-cn luci-i18n-modemband-zh-cn"
          CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-i18n-mwan3-zh-cn"
          EOF
          echo "✅ 已追加 LTE 拨号套件"

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/mediatek-filogic/build24.sh

      - name: Build ImmortalWrt for RG-MTFi-M520
        run: |
          echo "Profile : $PROFILE"
          echo "Tag     : $IB_TAG"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/glinet:/home/build/immortalwrt/files/etc/uci-defaults" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/arch/ipq806x.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/mediatek-filogic/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$PROFILE \
            -e INCLUDE_DOCKER=$INCLUDE_DOCKER \
            -e ENABLE_PPPOE=$ENABLE_PPPOE \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
          immortalwrt/imagebuilder:$IB_TAG /bin/bash /home/build/immortalwrt/build.sh

      - name: Fix artifact ownership
        run: sudo chown -R "$USER" "${{ github.workspace }}/bin"

      - name: List outputs
        run: ls -lh ${{ github.workspace }}/bin/targets/${{ env.PLATFORM }}/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.PROFILE }}-${{ github.run_number }}
          path: ${{ github.workspace }}/bin/targets/${{ env.PLATFORM }}/*
          if-no-files-found: error

      - name: Create info
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### 锐捷 RG-MTFi-M520 (高通 IPQ8064 / ipq806x)"
            echo "- 版本: \`$IB_TAG\`"
            echo "- 管理地址: $ROUTER_IP"
            echo "- LTE 套件: $INCLUDE_MODEM"
            echo "- Docker: $INCLUDE_DOCKER"
            echo ""
            echo "刷机说明: 原厂固件用 \`factory.bin\`，已是 ImmortalWrt 的用 \`sysupgrade.bin\`。"
          } > ${{ github.workspace }}/m520-info.md

      - name: Upload ImmortalWrt as release assets
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PROFILE }}
          name: ImmortalWrt RG-MTFi-M520
          body_path: ${{ github.workspace }}/m520-info.md
          files: |
            ${{ github.workspace }}/bin/targets/${{ env.PLATFORM }}/*
          token: ${{ secrets.GITHUB_TOKEN }}
